services:
  db:
    image: postgres:17-alpine
    container_name: llmchat-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmchat}
      POSTGRES_USER: ${POSTGRES_USER:-llmchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmchat}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: llmchat-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  redis-data:
