<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{title}}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f3f8">
    <!-- Dòng xem trước trong hộp thư (ẩn khi mở mail) -->
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">
      {{preheader}}
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f3f8"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border-radius: 14px;
              overflow: hidden;
              font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                &quot;Segoe UI&quot;,
                Roboto,
                &quot;Helvetica Neue&quot;,
                Arial,
                sans-serif;
            "
          >
            <!-- Logo -->
            <tr>
              <td align="center" style="padding: 48px 40px 8px">
                <img
                  src="{{logoUrl}}"
                  width="80"
                  height="80"
                  alt="LLM Chad"
                  style="
                    display: block;
                    margin: 0 auto;
                    border: 0;
                    border-radius: 20px;
                  "
                />
                <h1
                  style="
                    margin: 28px 0 12px;
                    font-size: 26px;
                    line-height: 1.3;
                    font-weight: 700;
                    letter-spacing: -0.5px;
                    color: #1b1924;
                  "
                >
                  {{title}}
                </h1>
                <p
                  style="
                    margin: 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #3a3647;
                  "
                >
                  {{intro}}
                </p>
              </td>
            </tr>

            <!-- Mã -->
            <tr>
              <td style="padding: 28px 40px 0">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #f1f0f5;
                        border-radius: 12px;
                        padding: 26px 12px;
                        font-family:
                          &quot;JetBrains Mono&quot;, &quot;SF Mono&quot;,
                          ui-monospace, Menlo, Consolas, monospace;
                        font-size: 40px;
                        line-height: 1;
                        font-weight: 600;
                        letter-spacing: 14px;
                        color: #1b1924;
                      "
                    >
                      <!-- padding-left bù cho letter-spacing của ký tự cuối để mã nằm giữa -->
                      <span style="padding-left: 14px">{{code}}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Ghi chú -->
            <tr>
              <td align="center" style="padding: 28px 40px 36px">
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.7;
                    color: #6b6880;
                  "
                >
                  {{ignore}}<br />{{expires}}
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 0 40px">
                <div
                  style="
                    border-top: 1px solid #e7e5ee;
                    font-size: 0;
                    line-height: 0;
                  "
                >
                  &nbsp;
                </div>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 20px 40px 28px;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #9a97ab;
                "
              >
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
