spring.config.import=optional:file:.env[.properties]
spring.application.name=llmchad

server.port=8080
server.forward-headers-strategy=framework

# Gửi mail xác minh qua Gmail SMTP. VALIDATION_PWD là App Password 16 ký tự, không phải mật khẩu Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${VALIDATION_MAIL}
spring.mail.password=${VALIDATION_PWD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=LLM Chad <${VALIDATION_MAIL}>
app.mail.logo-url=https://llmchad.site/apple-touch-icon.png
# Gốc của link trong mail (đặt lại mật khẩu). Lấy từ config, không lấy từ Host của request
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# oauth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}

# PostgreSQL chạy bằng docker-compose.yml ở thư mục gốc (docker compose up -d).
# Biến môi trường ghi đè được, ví dụ SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=${POSTGRE_URL}
spring.datasource.username=${POSTGRE_USERNAME}
spring.datasource.password=${POSTGRE_PASSWORD}

# jwt secret
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=14d

# Redis chạy bằng docker-compose.yml (service redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# LLM (OpenAI-compatible), đọc từ .env
app.llm.base-url=${LLM_BASE_URL}
app.llm.api-key=${LLM_API_KEY}
app.llm.model=${LLM_MODEL}
