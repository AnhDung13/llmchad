name: PR check

# Chạy cho MỌI PR vào main. Chỉ kiểm tra code, không build image, không deploy.
#
# Không dùng `paths:` ở cấp workflow: nếu workflow không chạy thì check bắt buộc trong ruleset
# không bao giờ có kết quả và PR bị treo. Thay vào đó job `changes` xem PR đụng phần nào,
# phần không đụng thì job bị skip.
#
# Ruleset chỉ cần bắt buộc MỘT check: "PR check" (job cuối, gom kết quả của api + web).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter đọc danh sách file thay đổi của PR qua API
  pull-requests: read

# Push commit mới lên PR thì huỷ lần chạy cũ của chính PR đó cho đỡ tốn phút
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Sửa chính file này thì chạy cả hai để kiểm tra workflow mới
          # Lockfile nằm ở root (npm workspaces), đổi dependency cũng phải build lại web
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/pr-check.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/pr-check.yml'

  api:
    name: API tests
    needs: changes
    # Chạy tay (workflow_dispatch) thì luôn chạy
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Postgres + Redis cho contextLoads và các test @JdbcTest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llmchad
          POSTGRES_USER: llmchad
          POSTGRES_PASSWORD: llmchad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmchad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    # Giá trị giả, chỉ dùng trong CI
    env:
      POSTGRE_URL: jdbc:postgresql://localhost:5432/llmchad
      POSTGRE_USERNAME: llmchad
      POSTGRE_PASSWORD: llmchad
      # SecurityConfig decode bằng Base64, nên secret phải là chuỗi Base64 hợp lệ (>= 32 byte)
      JWT_SECRET: Y2ktb25seS1zZWNyZXQtYXQtbGVhc3QtMzItY2hhcmFjdGVycy1sb25n
      LLM_BASE_URL: http://localhost
      LLM_API_KEY: dummy
      LLM_MODEL: dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        working-directory: apps/api
        run: ./mvnw test -B

      # Test fail thì tải báo cáo surefire về xem chi tiết (tab Summary của run)
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/api/target/surefire-reports
          retention-days: 7

  web:
    name: Web lint & build
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      # build = tsc -b && vite build, nên bước này cũng bắt lỗi type
      - name: Build
        run: npm run build -w apps/web

  # Check duy nhất cần đặt bắt buộc trong ruleset.
  # always(): vẫn chạy khi api/web fail hoặc bị skip, để luôn báo kết quả (không có `if` này
  # thì job sẽ bị skip theo khi api fail, mà skip lại được tính là Success → lọt PR lỗi).
  pr-check:
    name: PR check
    needs: [changes, api, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Kết quả: $RESULTS"
          # success hoặc skipped là qua; failure / cancelled là chặn merge
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Có job không thành công ($r)"
              exit 1
            fi
          done
